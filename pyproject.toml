[project]
name = "verwirrung"
version = "0.1.0"
description = "Interactive diary and maze of Charlie Gordon's mind (based on 'Flowers for Algernon')"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "lxml>=5,<7",

    "pymorphy3>=2,<3",
    "pymorphy3-dicts-ru>=2.4,<3",
    "razdel>=0.5,<1",
    "nltk>=3.8,<4",

    "numpy>=1.26,<3",
    "pandas>=2,<4",
    "scipy>=1.11,<2",

    "matplotlib>=3.7,<4",
    "seaborn>=0.13,<1",
    "plotly>=5,<7",

    "streamlit>=1.30,<2",

    "tqdm>=4.66,<5",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4,<5",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verwirrung"]